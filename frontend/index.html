<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila AI - Your Cybernetic Best Friend</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="neon-blue">Lila</span>_AI</h1>
            <p class="tagline">Your Cybernetic Brainstorm Partner</p>
        </header>
        <div class="chat-window" id="chat-window">
            <div class="message lila">
                <p class="typewriter" data-text="Hey Howard! Ready to hack some new ideas into existence?"></p>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your ideas, Howard...">
            <button id="send-btn">SEND_</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
